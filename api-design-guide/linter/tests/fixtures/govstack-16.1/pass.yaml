openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: HTTP push modelled with top-level webhooks (no callbacks).
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /v1/orders:
    post:
      operationId: createOrder
      summary: Create an order
      description: Creates an order.
      tags: [orders]
      responses:
        '201':
          description: Created
webhooks:
  orderStatusChanged:
    post:
      summary: Order status changed
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              type: object
      responses:
        '200':
          description: Acknowledged
