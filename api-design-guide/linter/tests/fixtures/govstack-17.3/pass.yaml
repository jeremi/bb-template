asyncapi: 3.0.0
info:
  title: Registry events
  version: 1.0.0
channels:
  personCreated:
    address: org.govstack.reg.v1.person.created
    parameters:
      tenant:
        description: tenant routing key
      region:
        description: deployment region
    messages:
      evt:
        $ref: '#/components/messages/PersonEvent'
operations:
  onPersonEvent:
    action: receive
    channel:
      $ref: '#/channels/personCreated'
    messages:
      - $ref: '#/channels/personCreated/messages/evt'
components:
  messages:
    PersonEvent:
      payload:
        type: object
      examples:
        - name: sample
          payload: {}
