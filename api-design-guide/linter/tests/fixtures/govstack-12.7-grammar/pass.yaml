openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
  description: Fixture for govstack-12.7-grammar.
  contact: {}
paths:
  /v1/foos:
    get:
      operationId: listFoos
      summary: List foos
      description: List foos.
      tags: [foos]
      parameters:
        - name: sort
          in: query
          schema: { type: string, pattern: '^-?[A-Za-z_][A-Za-z0-9_]*(,-?[A-Za-z_][A-Za-z0-9_]*)*$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object }
