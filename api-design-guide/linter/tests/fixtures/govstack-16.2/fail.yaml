openapi: 3.1.0
info:
  title: Payments Events API
  version: 1.0.0
  description: Webhook payload is not a valid CloudEvents envelope.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
webhooks:
  paymentCompleted:
    post:
      summary: Payment completed event
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              type: object
              required: [specversion, id, source, type]
              properties:
                specversion:
                  type: string
                id:
                  type: string
                source:
                  type: string
                type:
                  type: string
      responses:
        '200':
          description: Acknowledged
