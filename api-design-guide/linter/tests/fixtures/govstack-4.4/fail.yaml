openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Widgets API.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
servers:
  - url: https://{gatewayHost}/sample/v1
    variables:
      gatewayHost:
        default: gateway.example.org
paths:
  /v1/widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns the collection of widgets, sorted by creation date.
      tags: [widgets]
      responses:
        '200':
          description: OK
  /v1/gadgets:
    get:
      operationId: listGadgets
      summary: List gadgets
      description: Returns the collection of widgets, sorted by creation date.
      tags: [gadgets]
      responses:
        '200':
          description: OK
