    address: org.govstack.reg.v1.prod.person.created
    messages:
      evt:
        $ref: '#/components/messages/PersonCreated'
operations:
  onPersonCreated:
    action: receive
    channel:
      $ref: '#/channels/personCreated'
    messages:
      - $ref: '#/channels/personCreated/messages/evt'
components:
