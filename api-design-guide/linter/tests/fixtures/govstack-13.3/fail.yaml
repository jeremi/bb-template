# 13.3 fail: no service-to-service scheme. Only OIDC and an oauth2 scheme whose
# single flow is authorizationCode (not clientCredentials).
openapi: 3.1.0
info:
  title: Registry API
  version: 1.0.0
components:
  securitySchemes:
    OIDC:
      type: openIdConnect
      openIdConnectUrl: https://example.org/.well-known/openid-configuration
    OAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.org/authorize
          tokenUrl: https://example.org/token
          scopes: {}
paths:
  /v1/things:
    get:
      security:
        - OIDC: []
      responses:
        '200':
          description: ok
