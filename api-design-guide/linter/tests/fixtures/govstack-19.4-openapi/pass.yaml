openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Fixture for govstack-19.4-openapi — Accept-Language accepted and Content-Language declared on the response.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /v1/things:
    get:
      operationId: listThings
      summary: List things
      description: Returns the collection of things.
      tags: [things]
      parameters:
        - name: Accept-Language
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          headers:
            Content-Language:
              description: Language of the localised response content.
              schema:
                type: string
