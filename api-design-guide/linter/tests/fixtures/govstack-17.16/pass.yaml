asyncapi: 3.0.0
info:
  title: Payments commands
  version: 1.0.0
channels:
  submitPayment:
    address: global.govstack.pay.v1.payment.submit
    messages:
      cmd:
        $ref: '#/components/messages/SubmitPayment'
      rejected:
        $ref: '#/components/messages/PaymentRejected'
operations:
  onSubmitPayment:
    action: receive
    channel:
      $ref: '#/channels/submitPayment'
    messages:
      - $ref: '#/channels/submitPayment/messages/cmd'
components:
  messages:
    SubmitPayment:
      payload:
        type: object
        required: [specversion, id, source, type, data]
        properties:
          specversion:
            const: "1.0"
          id:
            type: string
          source:
            type: string
          type:
            type: string
          data:
            type: object
      examples:
        - name: sample
          payload: {}
    PaymentRejected:
      # CloudEvents-wrapped §11 error, correlated to the original command.
      contentType: application/cloudevents+json
      correlationId:
        location: '$message.header#/correlationId'
      payload:
        allOf:
          - $ref: './common/govstack-asyncapi-common.yaml#/components/schemas/CloudEventEnvelope'
          - type: object
            required: [data]
            properties:
              data:
                $ref: './common/govstack-asyncapi-common.yaml#/components/schemas/GovStackAsyncError'
      examples:
        - name: sample
          payload:
            specversion: '1.0'
            id: f68f9e59-f7aa-4efe-b3a1-4f893c0ce99d
            source: urn:govstack:bb:pay
            type: global.govstack.pay.payment.rejected
            data:
              type: about:blank
              title: Payment rejected
              code: global.govstack.pay.paymentRejected
              traceId: 9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c
              timestamp: '2026-07-10T12:41:05Z'
