asyncapi: 3.0.0
info:
  title: Shared envelope reuse fail
  version: 1.0.0
channels:
  events:
    address: registry.events
    messages:
      event:
        $ref: '#/components/messages/RecordCreated'
operations:
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/events'
    messages:
      - $ref: '#/channels/events/messages/event'
components:
  messages:
    RecordCreated:
      contentType: application/cloudevents+json
      payload:
        type: object
        required: [specversion, id, source, type, data]
        properties:
          specversion:
            const: '1.0'
          id:
            type: string
          source:
            type: string
          type:
            type: string
          data:
            type: object
      examples:
        - name: sample
          payload: {}
