asyncapi: 3.0.0
info:
  title: Shared envelope reuse fail
  version: 1.0.0
channels:
  events:
    address: registry.events
    messages:
      event:
        $ref: '#/components/messages/RecordCreated'
operations:
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/events'
    messages:
      - $ref: '#/channels/events/messages/event'
components:
  messages:
    RecordCreated:
      # Inline async errors still have to reuse the shared error schema.
      contentType: application/json
      payload:
        type: object
        required: [code, traceId]
        properties:
          code:
            type: string
          traceId:
            type: string
      examples:
        - name: sample
          payload: {code: REJECTED, traceId: trace-1}
