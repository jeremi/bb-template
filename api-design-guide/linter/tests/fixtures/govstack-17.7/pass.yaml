asyncapi: 3.0.0
info:
  title: Shared envelope reuse pass
  version: 1.0.0
channels:
  events:
    address: registry.events
    messages:
      event:
        $ref: '#/components/messages/RecordCreated'
operations:
  receiveEvent:
    action: receive
    channel:
      $ref: '#/channels/events'
    messages:
      - $ref: '#/channels/events/messages/event'
components:
  messages:
    RecordCreated:
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: './common/govstack-asyncapi-common.yaml#/components/schemas/CloudEventEnvelope'
          - type: object
            required: [data]
            properties:
              type:
                const: global.govstack.registry.record.created
              data:
                type: object
      examples:
        - name: sample
          payload: {}
    LocalJsonCommand:
      contentType: application/json
      payload:
        type: object
        properties:
          command:
            type: string
      examples:
        - name: sample
          payload:
            command: refresh
