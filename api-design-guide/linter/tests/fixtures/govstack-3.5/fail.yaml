# 3.5 fail: info block is missing the required description.
asyncapi: 3.0.0
info:
  title: Identity Events
  version: 1.2.0
servers:
  production:
    host: '{brokerHost}'
    protocol: kafka
channels:
  userSignedUp:
    address: global.govstack.identity.v1.user.signedup
    messages:
      userSignedUp:
        $ref: '#/components/messages/UserSignedUp'
operations:
  receiveUserSignedUp:
    action: receive
    summary: Receive user signed-up events.
    description: Triggered when a user completes registration.
    tags:
      - name: user
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/userSignedUp'
components:
  messages:
    UserSignedUp:
      name: UserSignedUp
      payload:
        type: object
        properties:
          userId:
            type: string
