openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Credentials travel via the Authorization header.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      description: List items.
      tags: [items]
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
