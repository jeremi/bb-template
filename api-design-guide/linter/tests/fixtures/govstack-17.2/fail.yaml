asyncapi: 3.0.0
info:
  title: Registry events
  version: 1.0.0
channels:
  personCreated:
    # 17.2: the logical ID is not reverse-DNS, even though the native address is valid.
    address: registrants/{tenant}/created
    messages:
      evt:
        $ref: '#/components/messages/PersonCreated'
operations:
  onPersonCreated:
    action: receive
    channel:
      $ref: '#/channels/personCreated'
    messages:
      - $ref: '#/channels/personCreated/messages/evt'
components:
  messages:
    PersonCreated:
      payload:
        type: object
      examples:
        - name: sample
          payload: {}
