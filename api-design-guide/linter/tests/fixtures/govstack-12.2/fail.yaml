openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
  description: Fixture for govstack-12.2.
  contact: {}
paths:
  /v1/foos:
    get:
      operationId: listFoos
      summary: List foos
      description: List foos.
      tags: [foos]
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items: { type: object }
                  pageInfo:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor: { type: string, nullable: true }
