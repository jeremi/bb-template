openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: A sample API with a compliant /health endpoint.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Returns basic liveness status for this BB.
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }
        "503":
          description: Service is temporarily unable to accept work.
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status]
                properties:
                  type: { type: string, format: uri }
                  title: { type: string }
                  status: { type: integer }
