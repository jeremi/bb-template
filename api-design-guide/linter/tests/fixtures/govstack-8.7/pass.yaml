openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Rate-limited endpoint declares Retry-After on 429; the advisory RateLimit header is optional.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      description: List items.
      tags: [items]
      responses:
        "200":
          description: OK
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: integer
  /reports:
    get:
      operationId: listReports
      summary: List reports
      description: List reports.
      tags: [reports]
      responses:
        "200":
          description: OK
          headers:
            RateLimit:
              schema:
                type: string
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: integer
            RateLimit:
              schema:
                type: string
