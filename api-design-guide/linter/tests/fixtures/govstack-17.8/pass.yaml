asyncapi: 3.0.0
info:
  title: Registry events
  version: 1.0.0
channels:
  personCreated:
    address: global.govstack.reg.v1.person.created
    messages:
      evt:
        $ref: '#/components/messages/PersonCreated'
operations:
  onPersonCreated:
    action: receive
    channel:
      $ref: '#/channels/personCreated'
    messages:
      - $ref: '#/channels/personCreated/messages/evt'
components:
  messages:
    PersonCreated:
      headers:
        type: object
        properties:
          idempotencyKey:
            type: string
          acceptLanguage:
            type: string
      payload:
        type: object
      examples:
        - name: sample
          payload: {}
