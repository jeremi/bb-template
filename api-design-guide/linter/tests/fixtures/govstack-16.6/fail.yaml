openapi: 3.1.0
info:
  title: Payments Events API
  version: 1.0.0
  description: Webhook delivery does not declare a GovStack-Signature header.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
webhooks:
  paymentCompleted:
    post:
      summary: Payment completed event
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              type: object
      responses:
        '200':
          description: Acknowledged
