openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Widgets API.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
servers:
  - url: https://{gatewayHost}/sample/v1
    variables:
      gatewayHost:
        default: gateway.example.org
paths:
  /v1/widgets:
    patch:
      operationId: bulkUpdateWidgets
      summary: Bulk update widgets
      description: Partially updates every widget matching the given status filter.
      tags: [widgets]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
      responses:
        '200':
          description: OK
