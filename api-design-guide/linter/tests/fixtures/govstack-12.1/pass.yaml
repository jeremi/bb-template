openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
  description: Fixture for govstack-12.1.
  contact: {}
paths:
  /v1/foos:
    get:
      operationId: listFoos
      summary: List foos
      description: List foos.
      tags: [foos]
      parameters:
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, pageInfo]
                properties:
                  items:
                    type: array
                    items: { type: object }
                  pageInfo:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor: { type: string, nullable: true }
  # Guide 12.1 lets a collection whose size the specification itself fixes go
  # unpaginated, provided the bound is declared with maxItems.
  /v1/supported-locales:
    get:
      operationId: listSupportedLocales
      summary: List supported locales
      description: The fixed set of locales this BB serves.
      tags: [foos]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 40
                    items: { type: string }
  # Guide 12.1 covers endpoints returning collections; the operational liveness
  # probe /health is not a collection, so a bare GET must NOT fire this rule.
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Unversioned operational liveness probe (guide 5.9).
      tags: [health]
      security: []
      responses:
        '200':
          description: OK
