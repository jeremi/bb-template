# 13.5 pass: the apiKey scheme is carried in a header, not a query or cookie.
openapi: 3.1.0
info:
  title: Registry API
  version: 1.0.0
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
paths:
  /health:
    get:
      security:
        - ApiKey: []
      responses:
        '200':
          description: ok
