# 13.5 fail: an apiKey scheme carries the credential in a query parameter.
openapi: 3.1.0
info:
  title: Registry API
  version: 1.0.0
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: query
      name: api_key
paths:
  /health:
    get:
      security:
        - ApiKey: []
      responses:
        '200':
          description: ok
