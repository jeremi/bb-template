# 3.6 fail: `operations` is empty — a document with only schemas and channels is
# not an API contract.
asyncapi: 3.0.0
info:
  title: Identity Events
  version: 1.2.0
  description: Emits identity lifecycle events for the Identity building block.
  contact:
    name: GovStack Identity BB
    url: https://example.org/contact
servers:
  production:
    host: '{brokerHost}'
    protocol: kafka
channels:
  userSignedUp:
    address: org.govstack.identity.v1.user.signedup
    messages:
      userSignedUp:
        $ref: '#/components/messages/UserSignedUp'
operations: {}
components:
  messages:
    UserSignedUp:
      name: UserSignedUp
      payload:
        type: object
        properties:
          userId:
            type: string
