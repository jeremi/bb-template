openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: No new X- prefixed headers; the legacy X-Request-Id is still allowed.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /items:
    get:
      operationId: listItems
      summary: List items
      description: List items.
      tags: [items]
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: Custom-Trace
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            Total-Count:
              schema:
                type: integer
