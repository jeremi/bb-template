# Fixture for govstack-18.7 — x-govstack-deprecated is present but missing
# sunset/replacement/reason. Description already mentions deprecation so this
# fixture isolates the shape violation from govstack-18.7-description.
asyncapi: 3.0.0
info:
  title: Identity Events
  version: 1.2.0
  description: Emits identity lifecycle events for the Identity building block.
  contact:
    name: GovStack Identity BB
    url: https://example.org/contact
servers:
  production:
    host: '{brokerHost}'
    protocol: kafka
    variables:
      brokerHost:
        default: broker.example.org
channels:
  userSignedUp:
    address: global.govstack.identity.v1.user.signedup
    messages:
      userSignedUp:
        $ref: '#/components/messages/UserSignedUp'
operations:
  receiveUserSignedUp:
    action: receive
    summary: Receive user signed-up events.
    description: Triggered when a user completes registration.
    tags:
      - name: user
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/userSignedUp'
components:
  messages:
    UserSignedUp:
      name: UserSignedUp
      title: User Signed Up
      description: Deprecated; superseded by UserRegistered.
      x-govstack-deprecated:
        since: '2025-01-01'
      payload:
        type: object
        properties:
          userId:
            type: string
            description: Identifier of the user.
