openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Fixture for govstack-7.17 — PUT missing If-Match parameter and 412 response.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /v1/things/{thingId}:
    parameters:
      - name: thingId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceThing
      summary: Replace a thing
      description: Replaces a thing in its entirety.
      tags: [things]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
        '500':
          description: Internal Server Error
