openapi: 3.1.0
info:
  title: Fixture API
  version: 1.0.0
  description: Fixture for govstack-12.6.
  contact: {}
paths:
  /v1/admin/foos:
    get:
      operationId: listAdminFoos
      summary: List foos (admin)
      description: List foos for admin tooling, offset-paginated.
      tags: [foos]
      parameters:
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, offset, limit, total]
                properties:
                  items:
                    type: array
                    items: { type: object }
                  offset: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
