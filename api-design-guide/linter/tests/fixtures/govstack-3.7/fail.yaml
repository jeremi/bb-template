# 3.7 fail: the operation is missing summary, description and tags. Its action,
# channel reference and message reference are otherwise valid and resolvable.
asyncapi: 3.0.0
info:
  title: Identity Events
  version: 1.2.0
  description: Emits identity lifecycle events for the Identity building block.
  contact:
    name: GovStack Identity BB
    url: https://example.org/contact
servers:
  production:
    host: '{brokerHost}'
    protocol: kafka
channels:
  userSignedUp:
    address: org.govstack.identity.v1.user.signedup
    messages:
      userSignedUp:
        $ref: '#/components/messages/UserSignedUp'
operations:
  receiveUserSignedUp:
    action: receive
    channel:
      $ref: '#/channels/userSignedUp'
    messages:
      - $ref: '#/channels/userSignedUp/messages/userSignedUp'
components:
  messages:
    UserSignedUp:
      name: UserSignedUp
      payload:
        type: object
        properties:
          userId:
            type: string
