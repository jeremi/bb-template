openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Widgets API.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
servers:
  - url: https://{gatewayHost}/sample/v1
    variables:
      gatewayHost:
        default: gateway.example.org
paths:
  /v1/widgets:search:
    post:
      operationId: searchWidgets
      summary: Search widgets
      description: Runs a complex widget search.
      tags: [widgets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Search results
