openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Widgets API.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
servers:
  - url: https://{gatewayHost}/sample/v1
    variables:
      gatewayHost:
        default: gateway.example.org
paths:
  /v1/widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns the collection of widgets.
      tags: [widgets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      description: A single widget resource.
      properties:
        id:
          type: string
          description: The widget's unique identifier.
    WidgetSelector:
      type: object
      description: Selects a widget by one of two typed keys.
      properties:
        selector:
          type: string
          description: Selector name, constrained together with its value by oneOf.
        value:
          type: string
          description: Key value for the chosen selector.
      oneOf:
        # Branches narrow the described properties; their descriptions carry over.
        - description: Lookup by serial number.
          properties:
            selector:
              const: bySerial
        - description: Lookup by asset tag.
          properties:
            selector:
              const: byAssetTag
