openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: Widgets API.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
servers:
  - url: https://{gatewayHost}/sample/v1
    variables:
      gatewayHost:
        default: gateway.example.org
paths:
  /v1/widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns the collection of widgets.
      tags: [widgets]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
