# GovStack API Design Guide — GOLDEN OpenAPI reference spec
# =========================================================
# A small, realistic OpenAPI 3.1.0 spec for a fictional GovStack Building Block
# (bb-code: "registry", a civil-registration registry). It is written to satisfy
# EVERY check in the default bundled ruleset simultaneously and to double as a
# copy-able reference for BB spec editors.
#
# It deliberately exercises the guide's shapes: /v1 kebab-case paths, camelCase
# params/properties, described schemas (§4.1) with examples (§4.2), the §5.9
# health endpoint family, local error Response Objects/examples built on the
# external RFC 9457 Problem and ValidationProblem schemas (§11), cursor pagination
# (§12), a creating POST with Idempotency-Key + Location (§8.3/§14.1), traceparent
# Trace Context correlation (§8.4), ETag/If-Match optimistic concurrency (§7.16/§7.17), merge-
# patch PATCH (§6.4), async long-running Operations (§15), CloudEvents webhooks +
# subscription control plane (§16), OAuth2/OIDC/mTLS security with namespaced
# scopes (§13), and the §20.3 conformance declaration.
#
# This spec lints to ZERO findings under the default ruleset. The ruleset
# exempts the §5.10 standard unversioned endpoints (here, /health) from the
# resource-oriented rules that do not apply to them (§5.1 version prefix, §5.3
# segment casing, §12.x pagination, §7.16 ETag), scopes the §5.9
# application/json media type to the SUCCESS (200) response so the §11.1
# problem+json error responses are satisfiable, and counts only non-param
# segments toward §5.4 max nesting depth so the §15.5 action sub-resource path
# (/v1/operations/{operationId}/cancel) stays within two levels.
openapi: 3.1.0
info:
  title: GovStack Registry Building Block API
  version: 1.0.0
  description: >-
    Synchronous REST surface of the fictional GovStack Registry Building Block:
    manage registrants, run long-running bulk imports as asynchronous
    Operations, and manage webhook subscriptions for registrant lifecycle
    events. This document is a conformance reference for the GovStack Cross-BB
    API Design Guide.
  contact:
    name: GovStack Registry BB Maintainers
    url: https://example.gov/registry/support
    email: registry-api@example.gov
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  x-govstack-api-guide:
    version: 0.2.0-draft
    rulesetVersion: 0.2.0-draft
servers:
  - url: https://api.example.gov/registry
    description: Production gateway for the Registry Building Block.
  - url: https://sandbox.api.example.gov/registry
    description: Sandbox environment for integration testing.
security:
  - registryOAuth:
      - bb:registry:registrant:read
tags:
  - name: Registrants
    description: Create, read, update and delete registrant records.
  - name: Operations
    description: Poll and cancel long-running asynchronous Operations.
  - name: Subscriptions
    description: Manage webhook subscriptions for registrant lifecycle events.
  - name: Health
    description: Operational liveness endpoint.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: >-
        Unversioned operational liveness endpoint per guide §5.9. Health is carried
        by the status code: 200 when the service can accept work, 503 when it
        temporarily cannot. Unauthenticated and free of citizen data and
        system-internal detail.
      tags: [Health]
      security: []
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The service is alive and able to accept work.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        # §5.9 requires the unhealthy status code as well as the healthy one, and
        # §11.1 makes every 4xx/5xx application/problem+json, so the 503 carries
        # the standard problem envelope (Cache-Control: no-store included). The
        # §5.9 application/json media type applies to the SUCCESS (200) payload
        # above, not to error responses.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        # §7.13 requires a documented 500 on every operation.
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/registrants:
    get:
      operationId: listRegistrants
      summary: List registrants
      description: >-
        Returns a cursor-paginated page of registrant records, most recently
        updated first. Supports simple equality filtering and sorting.
      tags: [Registrants]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterRegistrationStatus'
        - $ref: '#/components/parameters/FilterCountryCode'
      responses:
        '200':
          description: A page of registrants.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrantPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createRegistrant
      summary: Create a registrant
      description: >-
        Registers a new registrant and returns the created record. Non-idempotent
        create: clients must supply an Idempotency-Key so retries are safe.
      tags: [Registrants]
      security:
        - registryOAuth:
            - bb:registry:registrant:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Attributes for the registrant to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrantCreate'
      responses:
        '201':
          description: The registrant was created.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/registrants/{registrantId}:
    parameters:
      - $ref: '#/components/parameters/RegistrantId'
    get:
      operationId: getRegistrant
      summary: Fetch a registrant
      description: Returns a single registrant record by its opaque identifier.
      tags: [Registrants]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The registrant record.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: replaceRegistrant
      summary: Replace a registrant
      description: >-
        Fully replaces a registrant record. Uses optimistic concurrency: the
        caller must echo the current ETag via If-Match.
      tags: [Registrants]
      security:
        - registryOAuth:
            - bb:registry:registrant:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: The full replacement representation of the registrant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrantCreate'
      responses:
        '200':
          description: The registrant was replaced.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateRegistrant
      summary: Partially update a registrant
      description: >-
        Applies a JSON Merge Patch (RFC 7396) to a registrant record. Uses
        optimistic concurrency via If-Match.
      tags: [Registrants]
      security:
        - registryOAuth:
            - bb:registry:registrant:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: The merge-patch document describing the fields to change.
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/RegistrantPatch'
      responses:
        '200':
          description: The registrant was updated.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deleteRegistrant
      summary: Delete a registrant
      description: Permanently removes a registrant record.
      tags: [Registrants]
      security:
        - registryOAuth:
            - bb:registry:registrant:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '204':
          description: The registrant was deleted; no body is returned.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/registrants/search:
    post:
      operationId: searchRegistrants
      summary: Search registrants
      description: >-
        Complex, read-only registrant query. Returns 200 (never 201) and uses the
        cursor pagination envelope; filter criteria and pagination travel in the
        request body per guide §6.6/§12.9.
      tags: [Registrants]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        description: The search filter plus cursor pagination controls.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrantSearchRequest'
      responses:
        '200':
          description: A page of matching registrants.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrantPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/bulk-imports:
    post:
      operationId: startBulkImport
      summary: Start a bulk import
      description: >-
        Starts a long-running bulk import of registrants from an external source.
        The work cannot complete synchronously, so the endpoint returns 202 with a
        Location pointing at the Operation resource to poll.
      tags: [Operations]
      security:
        - registryOAuth:
            - bb:registry:registrant:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Location of the source data to import.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImportRequest'
      responses:
        '202':
          description: The import was accepted; poll the Operation for progress.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/operations/{operationId}:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      operationId: getOperation
      summary: Poll an Operation
      description: >-
        Returns the current state of a long-running Operation so a client can poll
        for completion, per guide §15.4.
      tags: [Operations]
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The current Operation state.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/operations/{operationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    post:
      operationId: cancelOperation
      summary: Cancel an Operation
      description: >-
        Requests cancellation of a long-running Operation, per guide §15.5. Returns
        the Operation with its updated status.
      tags: [Operations]
      security:
        - registryOAuth:
            - bb:registry:registrant:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cancellation was requested; the Operation state is returned.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      description: Returns a cursor-paginated page of webhook subscriptions.
      tags: [Subscriptions]
      security:
        - registryOAuth:
            - bb:registry:subscription:manage
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of subscriptions.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createSubscription
      summary: Create a subscription
      description: >-
        Registers a webhook subscription for registrant lifecycle events and
        returns the created subscription. Idempotent via Idempotency-Key.
      tags: [Subscriptions]
      security:
        - registryOAuth:
            - bb:registry:subscription:manage
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The subscription to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '201':
          description: The subscription was created.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    delete:
      operationId: deleteSubscription
      summary: Delete a subscription
      description: Cancels and removes a webhook subscription.
      tags: [Subscriptions]
      security:
        - registryOAuth:
            - bb:registry:subscription:manage
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '204':
          description: The subscription was deleted; no body is returned.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
webhooks:
  registrantRegistered:
    post:
      operationId: onRegistrantRegistered
      summary: Registrant registered event
      description: >-
        Delivered to a subscriber's callback URL when a registrant is registered.
        The body is a structured CloudEvents 1.0 envelope. This baseline example
        uses authenticated transport and does not opt into message signing.
      tags: [Subscriptions]
      requestBody:
        required: true
        description: A CloudEvents 1.0 envelope wrapping the registrant event.
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/RegistrantRegisteredEvent'
      responses:
        '200':
          description: The subscriber accepted the event.
        '410':
          description: >-
            The subscriber endpoint is gone; the publisher may disable the
            subscription.
components:
  securitySchemes:
    registryOAuth:
      type: oauth2
      description: >-
        OAuth 2.0 for citizen-facing and inter-BB access. The authorizationCode
        flow serves user-facing clients; the clientCredentials flow serves
        service-to-service (BB-to-BB) calls.
      flows:
        authorizationCode:
          authorizationUrl: https://id.example.gov/oauth2/authorize
          tokenUrl: https://id.example.gov/oauth2/token
          refreshUrl: https://id.example.gov/oauth2/token
          scopes:
            bb:registry:registrant:read: Read registrant records.
            bb:registry:registrant:write: Create, update and delete registrant records.
            bb:registry:subscription:manage: Manage webhook subscriptions.
        clientCredentials:
          tokenUrl: https://id.example.gov/oauth2/token
          scopes:
            bb:registry:registrant:read: Read registrant records.
            bb:registry:registrant:write: Create, update and delete registrant records.
            bb:registry:subscription:manage: Manage webhook subscriptions.
    registryOidc:
      type: openIdConnect
      description: OpenID Connect discovery for citizen authentication.
      openIdConnectUrl: https://id.example.gov/.well-known/openid-configuration
    registryMtls:
      type: mutualTLS
      description: Mutual TLS for high-assurance service-to-service calls.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: >-
        W3C Trace Context traceparent (§8.4). The service propagates a valid
        received context or creates a valid new context when absent or invalid.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Unique key making a non-idempotent create safe to retry (§8.3/§14.1). The
        server returns the original result for a repeated key.
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        ETag of the version the caller intends to modify, for optimistic
        concurrency (§7.17). A mismatch yields 412.
      schema:
        type: string
    RegistrantId:
      name: registrantId
      in: path
      required: true
      description: Opaque, server-generated identifier of a registrant.
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      description: Opaque identifier of a long-running Operation.
      schema:
        type: string
        minLength: 1
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Opaque identifier of a webhook subscription.
      schema:
        type: string
        format: uuid
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items to return in one page.
      schema:
        type: integer
        minimum: 1
        default: 20
        maximum: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque pagination cursor returned as pageInfo.nextCursor by a previous
        call. Omit to fetch the first page.
      schema:
        type: string
    Sort:
      name: sort
      in: query
      required: false
      description: >-
        Comma-separated sort keys; prefix a key with "-" for descending order
        (e.g. "-updatedAt,familyName").
      schema:
        type: string
        pattern: '^-?[a-zA-Z][a-zA-Z0-9]*(,-?[a-zA-Z][a-zA-Z0-9]*)*$'
    FilterRegistrationStatus:
      name: registrationStatus
      in: query
      required: false
      description: Equality filter on the registrant's registration status.
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]*$'
    FilterCountryCode:
      name: countryCode
      in: query
      required: false
      description: Equality filter on the registrant's ISO 3166-1 alpha-2 country code.
      schema:
        type: string
        pattern: '^[A-Z]{2}$'
  headers:
    Traceparent:
      description: Optional W3C Trace Context returned for diagnostic convenience.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
    Location:
      description: Absolute URL of the created or referenced resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Entity tag of the returned representation, for conditional requests.
      schema:
        type: string
    CacheControl:
      description: Caching directives; error and Operation-status bodies use no-store.
      schema:
        type: string
    WwwAuthenticate:
      description: Authentication challenge describing how to authenticate (RFC 9110).
      schema:
        type: string
  responses:
    NotModified:
      description: The representation is unchanged from the caller's cached ETag.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: The request could not be parsed or its non-field parameters were invalid.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/bad-request
            title: Bad request
            status: 400
            detail: The cursor parameter is malformed.
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    ValidationFailed:
      description: One or more request fields failed validation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: https://govstack.global/problems/registry/invalid-field
            title: Validation failed
            status: 422
            detail: One or more fields are invalid.
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
            errors:
              - pointer: /emailAddress
                message: Must be a valid email address.
    Unauthorized:
      description: Authentication is required or the supplied credentials are invalid.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/authentication-required
            title: Authentication required
            status: 401
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    Forbidden:
      description: The authenticated principal lacks a required OAuth scope.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/permission-denied
            title: Permission denied
            status: 403
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    NotFound:
      description: The requested resource does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/resource-not-found
            title: Resource not found
            status: 404
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    Conflict:
      description: The request conflicts with the current state of the resource.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/state-conflict
            title: State conflict
            status: 409
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    PreconditionFailed:
      description: The If-Match precondition did not hold; the resource was modified.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/precondition-failed
            title: Precondition failed
            status: 412
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    UnsupportedMediaType:
      description: The request media type is not supported by this endpoint.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/unsupported-media-type
            title: Unsupported media type
            status: 415
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    ServerError:
      description: An unexpected error occurred while processing the request.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/internal-error
            title: Internal error
            status: 500
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
    ServiceUnavailable:
      description: The service is temporarily unable to accept work (guide §5.9).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/registry/service-unavailable
            title: Service unavailable
            status: 503
            traceId: 8f0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
  schemas:
    Problem:
      $ref: '../../../../api/common/govstack-openapi-common.yaml#/components/schemas/Problem'
    ValidationProblem:
      $ref: '../../../../api/common/govstack-openapi-common.yaml#/components/schemas/ValidationProblem'
    FieldError:
      $ref: '../../../../api/common/govstack-openapi-common.yaml#/components/schemas/FieldError'
    HealthStatus:
      type: object
      description: >-
        Minimal application/json body accompanying a 200 from the liveness
        endpoint. Health itself is carried by the status code (§5.9), so this
        body is informational: it names the service and nothing more. Versions,
        hostnames, and dependency topology are system-internal detail §5.9
        forbids here.
      properties:
        description:
          type: string
          description: Human-readable name of the service reporting health.
      examples:
        - description: health of the registry BB
    Money:
      type: object
      description: >-
        A monetary amount as a decimal string plus an ISO 4217 currency code
        (§10.4); never a binary float.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: Decimal amount as a string, e.g. "12.50".
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
        currency:
          type: string
          description: ISO 4217 alphabetic currency code.
          pattern: '^[A-Z]{3}$'
    Registrant:
      type: object
      description: A registrant record held by the Registry Building Block.
      required:
        - registrantId
        - givenName
        - familyName
        - registrationStatus
        - createdAt
        - updatedAt
      properties:
        registrantId:
          type: string
          format: uuid
          description: Opaque, server-generated unique identifier of the registrant.
        givenName:
          type: string
          description: The registrant's given (first) name.
        familyName:
          type: string
          description: The registrant's family (last) name.
        emailAddress:
          type: string
          format: email
          description: The registrant's contact email address (RFC 5322).
        phoneNumber:
          type: string
          description: The registrant's phone number in E.164 form.
          pattern: '^\+[1-9]\d{1,14}$'
        birthDate:
          type: string
          format: date
          description: The registrant's date of birth (RFC 3339 full-date).
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country of residence.
          pattern: '^[A-Z]{2}$'
        preferredLanguage:
          type: string
          description: Preferred communication language as a BCP 47 tag.
          pattern: '^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$'
        registrationStatus:
          type: string
          description: >-
            Lifecycle status of the registration: ACTIVE, SUSPENDED or
            DEREGISTERED.
          enum: [ACTIVE, SUSPENDED, DEREGISTERED]
          x-extensible-enum: true
        registrationFee:
          $ref: '#/components/schemas/Money'
        signature:
          type: string
          contentEncoding: base64
          maxLength: 100000
          description: Base64-encoded captured signature image, if provided (§10.7).
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the registrant was created.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the registrant was last modified.
      examples:
        - registrantId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
          givenName: Amina
          familyName: Diallo
          emailAddress: amina.diallo@example.com
          phoneNumber: '+221771234567'
          birthDate: '1990-04-12'
          countryCode: SN
          preferredLanguage: fr
          registrationStatus: ACTIVE
          registrationFee:
            amount: '12.50'
            currency: XOF
          createdAt: '2026-01-15T09:00:00Z'
          updatedAt: '2026-07-01T14:30:00Z'
    RegistrantCreate:
      type: object
      description: Writable attributes accepted when creating or replacing a registrant.
      required: [givenName, familyName]
      properties:
        givenName:
          type: string
          description: The registrant's given (first) name.
        familyName:
          type: string
          description: The registrant's family (last) name.
        emailAddress:
          type: string
          format: email
          description: The registrant's contact email address (RFC 5322).
        phoneNumber:
          type: string
          description: The registrant's phone number in E.164 form.
          pattern: '^\+[1-9]\d{1,14}$'
        birthDate:
          type: string
          format: date
          description: The registrant's date of birth (RFC 3339 full-date).
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country of residence.
          pattern: '^[A-Z]{2}$'
        preferredLanguage:
          type: string
          description: Preferred communication language as a BCP 47 tag.
          pattern: '^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$'
        registrationFee:
          $ref: '#/components/schemas/Money'
      examples:
        - givenName: Amina
          familyName: Diallo
          emailAddress: amina.diallo@example.com
          phoneNumber: '+221771234567'
          birthDate: '1990-04-12'
          countryCode: SN
          preferredLanguage: fr
    RegistrantPatch:
      type: object
      description: >-
        JSON Merge Patch body for a registrant (§6.4). Present fields are replaced;
        an explicit null clears a field.
      properties:
        emailAddress:
          type: string
          format: email
          description: New contact email address.
        phoneNumber:
          type: string
          description: New phone number in E.164 form.
          pattern: '^\+[1-9]\d{1,14}$'
        preferredLanguage:
          type: string
          description: New preferred language as a BCP 47 tag.
          pattern: '^[a-z]{2,3}(-[A-Z][a-z]{3})?(-([A-Z]{2}|[0-9]{3}))?$'
        registrationStatus:
          type: string
          description: New registration status.
          enum: [ACTIVE, SUSPENDED, DEREGISTERED]
          x-extensible-enum: true
      examples:
        - emailAddress: amina.new@example.com
          registrationStatus: SUSPENDED
    RegistrantSearchRequest:
      type: object
      description: Complex search filter plus cursor pagination controls (§12.9).
      properties:
        givenName:
          type: string
          description: Match registrants whose given name equals this value.
        familyName:
          type: string
          description: Match registrants whose family name equals this value.
        countryCode:
          type: string
          description: Match registrants in this ISO 3166-1 alpha-2 country.
          pattern: '^[A-Z]{2}$'
        registrationStatus:
          type: string
          description: Match registrants with this registration status.
          enum: [ACTIVE, SUSPENDED, DEREGISTERED]
          x-extensible-enum: true
        pageSize:
          type: integer
          description: Maximum number of items to return in one page.
          minimum: 1
          default: 20
          maximum: 100
        cursor:
          type: string
          description: Opaque pagination cursor from a previous page.
      examples:
        - countryCode: SN
          registrationStatus: ACTIVE
          pageSize: 20
    PageInfo:
      description: >-
        Page metadata. total, when present, is exact and describes the
        collection at the time this page is generated.
      $ref: '../../../../api/common/govstack-openapi-common.yaml#/components/schemas/PageInfo'
    RegistrantPage:
      type: object
      description: A cursor-paginated page of registrant records.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          description: The registrant records in this page.
          items:
            $ref: '#/components/schemas/Registrant'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      examples:
        - items:
            - registrantId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
              givenName: Amina
              familyName: Diallo
              registrationStatus: ACTIVE
              createdAt: '2026-01-15T09:00:00Z'
              updatedAt: '2026-07-01T14:30:00Z'
          pageInfo:
            nextCursor: b3BhcXVlLWN1cnNvci0y
    SubscriptionPage:
      type: object
      description: A cursor-paginated page of webhook subscriptions.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          description: The subscriptions in this page.
          items:
            $ref: '#/components/schemas/Subscription'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
      examples:
        - items:
            - subscriptionId: 9d1f3b2a-6c4e-4a1b-8f0d-2e5c7a9b1d33
              callbackUrl: https://partner.example.org/hooks/registry
              eventTypes:
                - global.govstack.registry.registrant.registered
              status: ACTIVE
              createdAt: '2026-06-01T08:00:00Z'
              updatedAt: '2026-06-01T08:00:00Z'
          pageInfo:
            nextCursor: null
    BulkImportRequest:
      type: object
      description: Instructions for a long-running bulk import.
      required: [sourceUrl]
      properties:
        sourceUrl:
          type: string
          format: uri
          description: URL of the source dataset to import.
        dryRun:
          type: boolean
          description: When true, validate the source without persisting records.
      examples:
        - sourceUrl: https://data.example.gov/registry/import-2026-07.csv
          dryRun: false
    Operation:
      type: object
      description: >-
        A long-running asynchronous Operation resource (§15.2). Clients poll it
        until status is terminal.
      required: [id, status, result, error, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque identifier of the Operation.
        status:
          type: string
          description: >-
            Lifecycle status of the Operation: PENDING, RUNNING, SUCCEEDED, FAILED
            or CANCELLED.
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]
          x-extensible-enum: true
        progress:
          type: integer
          description: Best-effort completion percentage from 0 to 100.
          minimum: 0
          maximum: 100
        result:
          type: [object, 'null']
          description: >-
            Operation-specific result payload once status is SUCCEEDED; null
            otherwise.
        error:
          type: [object, 'null']
          description: >-
            Problem details once status is FAILED; null otherwise.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the Operation was created.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the Operation last changed state.
      examples:
        - id: op_7JpQ9m2W4xK8fR3cT6vN1
          status: RUNNING
          progress: 42
          result: null
          error: null
          createdAt: '2026-07-10T12:00:00Z'
          updatedAt: '2026-07-10T12:03:00Z'
    Subscription:
      type: object
      description: A webhook subscription for registrant lifecycle events.
      required: [subscriptionId, callbackUrl, eventTypes, status, createdAt, updatedAt]
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: Opaque identifier of the subscription.
        callbackUrl:
          type: string
          format: uri
          description: HTTPS URL the events are delivered to.
        eventTypes:
          type: array
          description: Reverse-DNS event types this subscription receives.
          items:
            type: string
            description: A single reverse-DNS event type.
        status:
          type: string
          description: Whether the subscription is ACTIVE or PAUSED.
          enum: [ACTIVE, PAUSED]
          x-extensible-enum: true
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the subscription was created.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the subscription was last modified.
      examples:
        - subscriptionId: 9d1f3b2a-6c4e-4a1b-8f0d-2e5c7a9b1d33
          callbackUrl: https://partner.example.org/hooks/registry
          eventTypes:
            - global.govstack.registry.registrant.registered
          status: ACTIVE
          createdAt: '2026-06-01T08:00:00Z'
          updatedAt: '2026-06-01T08:00:00Z'
    SubscriptionCreate:
      type: object
      description: Attributes accepted when creating a subscription.
      required: [callbackUrl, eventTypes]
      properties:
        callbackUrl:
          type: string
          format: uri
          description: HTTPS URL the events will be delivered to.
        eventTypes:
          type: array
          description: Reverse-DNS event types to subscribe to.
          items:
            type: string
            description: A single reverse-DNS event type.
      examples:
        - callbackUrl: https://partner.example.org/hooks/registry
          eventTypes:
            - global.govstack.registry.registrant.registered
    RegistrantRegisteredEvent:
      type: object
      description: >-
        CloudEvents 1.0 envelope delivered when a registrant is registered (§16.2).
        GovStack domain data lives under data.
      required: [specversion, id, source, type, time, datacontenttype, data]
      properties:
        specversion:
          type: string
          description: CloudEvents specification version; always "1.0".
          const: '1.0'
        id:
          type: string
          description: Unique identifier of this event occurrence.
        source:
          type: string
          description: >-
            Stable logical identifier of the publishing context; never a
            deployment host, pod, broker or environment (§16.4).
          const: /govstack/registry
        type:
          type: string
          description: >-
            Reverse-DNS event type, global.govstack.{bb-code}.{resource}.{action},
            carrying no version segment (§16.3).
          const: global.govstack.registry.registrant.registered
        time:
          type: string
          format: date-time
          description: RFC 3339 timestamp at which the event occurred.
        datacontenttype:
          type: string
          description: Media type of the data member.
          const: application/json
        subject:
          type: string
          description: Identifier of the registrant the event concerns.
        data:
          $ref: '#/components/schemas/RegistrantEventData'
      examples:
        - specversion: '1.0'
          id: 0b8c1d2e-3f4a-5b6c-7d8e-9f0a1b2c3d4e
          source: /govstack/registry
          type: global.govstack.registry.registrant.registered
          time: '2026-07-10T12:34:56Z'
          datacontenttype: application/json
          subject: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
          data:
            registrantId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
            registrationStatus: ACTIVE
            occurredAt: '2026-07-10T12:34:56Z'
    RegistrantEventData:
      type: object
      description: GovStack domain payload for a registrant-registered event.
      required: [registrantId, registrationStatus, occurredAt]
      properties:
        registrantId:
          type: string
          format: uuid
          description: Identifier of the registrant that was registered.
        registrationStatus:
          type: string
          description: Registration status at the time of the event.
          enum: [ACTIVE, SUSPENDED, DEREGISTERED]
          x-extensible-enum: true
        occurredAt:
          type: string
          format: date-time
          description: RFC 3339 timestamp when the registration occurred.
