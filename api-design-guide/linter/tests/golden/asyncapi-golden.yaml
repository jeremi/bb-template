# GovStack API Design Guide — GOLDEN AsyncAPI reference spec
# ==========================================================
# A small, realistic AsyncAPI 3.0.0 spec for the same fictional GovStack Building
# Block (bb-code: "registry"). It is written to satisfy EVERY check in the default
# bundled ruleset simultaneously and to double as a copy-able reference for BB
# spec editors.
#
# It exercises the guide's event-driven shapes: reverse-DNS logical channel IDs
# with the major version (§17.2), native addresses, and declared+described
# parameters (§17.4), operations
# with send/receive perspective and complete metadata (§3.7/§17.1), CloudEvents
# JSON payloads (§17.6) with camelCase properties (§3.9) and camelCase headers
# (§17.8), message examples (§17.20), security covering every operation via the
# server (§17.10), shared external envelope and error schemas (§17.7), an async
# rejection message using the §11 error envelope with correlation (§17.16), a
# request-reply pair with a reply channel and correlationId (§17.17), protocol
# bindings matching the server protocol (§17.19), and the §20.3 conformance
# declaration.
#
# Unlike the OpenAPI golden, this file lints to ZERO findings: AsyncAPI has no
# unversioned /health analogue, so none of the rule-scoping contradictions apply.
asyncapi: 3.0.0
info:
  title: GovStack Registry Building Block Events
  version: 1.0.0
  description: >-
    Event-driven surface of the fictional GovStack Registry Building Block:
    publishes registrant lifecycle events and consumes registrant commands over
    Kafka. This document is a conformance reference for the GovStack Cross-BB API
    Design Guide.
  contact:
    name: GovStack Registry BB Maintainers
    url: https://example.gov/registry/support
    email: registry-api@example.gov
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  x-govstack-api-guide:
    version: 0.2.0-draft
    rulesetVersion: 0.2.0-draft
servers:
  production:
    host: kafka.example.gov:9092
    protocol: kafka
    description: Production Kafka broker for the Registry Building Block.
    security:
      - $ref: '#/components/securitySchemes/registryOAuth'
defaultContentType: application/cloudevents+json
channels:
  global.govstack.registry.v1.registrant.registered:
    address: registry.registrant.registered
    description: Registrant lifecycle events published by the Registry BB.
    servers:
      - $ref: '#/servers/production'
    messages:
      registered:
        $ref: '#/components/messages/registrantRegisteredEvent'
    bindings:
      kafka:
        bindingVersion: '0.5.0'
  global.govstack.registry.v1.registrant.commands:
    address: registry.registrant.{registrantId}.commands
    description: Commands directed at a specific registrant, consumed by the Registry BB.
    parameters:
      registrantId:
        $ref: '#/components/parameters/registrantId'
    servers:
      - $ref: '#/servers/production'
    messages:
      deregister:
        $ref: '#/components/messages/deregisterRegistrantCommand'
    bindings:
      kafka:
        bindingVersion: '0.5.0'
  global.govstack.registry.v1.registrant.command-replies:
    address: registry.registrant.command-replies
    description: Replies and rejections for registrant commands.
    servers:
      - $ref: '#/servers/production'
    messages:
      result:
        $ref: '#/components/messages/deregisterRegistrantResult'
      rejected:
        $ref: '#/components/messages/registrantDeregistrationRejected'
    bindings:
      kafka:
        bindingVersion: '0.5.0'
operations:
  sendRegistrantRegistered:
    action: send
    summary: Publish a registrant-registered event
    description: >-
      The Registry BB publishes a CloudEvents envelope whenever a registrant is
      registered. The broker may redeliver an event; consumers de-duplicate on
      the CloudEvents source and id pair. No ordering guarantee is promised.
    tags:
      - name: Registrants
    channel:
      $ref: '#/channels/global.govstack.registry.v1.registrant.registered'
    messages:
      - $ref: '#/channels/global.govstack.registry.v1.registrant.registered/messages/registered'
  receiveDeregisterCommand:
    action: receive
    summary: Consume a deregister-registrant command
    description: >-
      The Registry BB consumes a deregister command for a registrant and replies
      on the command-replies channel. The broker may redeliver the command; the
      command is idempotent on its CloudEvents idempotencykey attribute. This is
      a request-reply operation correlated by correlationId.
    tags:
      - name: Registrants
    channel:
      $ref: '#/channels/global.govstack.registry.v1.registrant.commands'
    messages:
      - $ref: '#/channels/global.govstack.registry.v1.registrant.commands/messages/deregister'
    reply:
      channel:
        $ref: '#/channels/global.govstack.registry.v1.registrant.command-replies'
      messages:
        - $ref: '#/channels/global.govstack.registry.v1.registrant.command-replies/messages/result'
  sendDeregistrationRejected:
    action: send
    summary: Publish a deregistration-rejected error
    description: >-
      The Registry BB publishes a rejection using the §11 error envelope when a
      deregister command cannot be honoured. Correlated to the originating command
      by correlationId.
    tags:
      - name: Registrants
    channel:
      $ref: '#/channels/global.govstack.registry.v1.registrant.command-replies'
    messages:
      - $ref: '#/channels/global.govstack.registry.v1.registrant.command-replies/messages/rejected'
components:
  securitySchemes:
    registryOAuth:
      type: oauth2
      description: OAuth 2.0 client-credentials for service-to-service event access.
      flows:
        clientCredentials:
          tokenUrl: https://id.example.gov/oauth2/token
          availableScopes:
            bb:registry:events:subscribe: Consume registrant lifecycle events.
            bb:registry:events:publish: Publish registrant lifecycle events.
  parameters:
    registrantId:
      description: Opaque, server-generated identifier of the registrant the channel routes on.
  messages:
    registrantRegisteredEvent:
      name: registrantRegisteredEvent
      title: Registrant registered
      summary: Emitted when a registrant is registered.
      contentType: application/cloudevents+json
      payload:
        allOf:
          - $ref: '../../../../api/common/govstack-asyncapi-common.yaml#/components/schemas/CloudEventEnvelope'
          - type: object
            description: Registry-specific event type and domain payload.
            required: [data]
            properties:
              type:
                description: Stable semantic event type.
                const: global.govstack.registry.registrant.registered
              data:
                type: object
                description: GovStack domain payload for the registrant-registered event.
                required: [registrantId, registrationStatus, occurredAt]
                properties:
                  registrantId:
                    type: string
                    format: uuid
                    description: Identifier of the registrant that was registered.
                  registrationStatus:
                    type: string
                    description: Registration status at the time of the event.
                    enum: [ACTIVE, SUSPENDED, DEREGISTERED]
                    x-extensible-enum: true
                  occurredAt:
                    type: string
                    format: date-time
                    description: RFC 3339 timestamp when the registration occurred.
      examples:
        - name: registrantRegistered
          summary: A newly registered registrant.
          payload:
            specversion: '1.0'
            id: 0b8c1d2e-3f4a-5b6c-7d8e-9f0a1b2c3d4e
            source: /govstack/registry
            type: global.govstack.registry.registrant.registered
            time: '2026-07-10T12:34:56Z'
            datacontenttype: application/json
            subject: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
            data:
              registrantId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
              registrationStatus: ACTIVE
              occurredAt: '2026-07-10T12:34:56Z'
    deregisterRegistrantCommand:
      name: deregisterRegistrantCommand
      title: Deregister registrant command
      summary: Requests deregistration of a registrant.
      contentType: application/cloudevents+json
      headers:
        type: object
        description: Message metadata headers for the deregister command.
        properties:
          correlationId:
            type: string
            format: uuid
            description: Correlation identifier echoed on the reply.
      correlationId:
        location: $message.header#/correlationId
        description: Correlates the command with its reply on the command-replies channel.
      payload:
        allOf:
          - $ref: '../../../../api/common/govstack-asyncapi-common.yaml#/components/schemas/CloudEventEnvelope'
          - type: object
            description: Registry-specific command type and domain payload.
            required: [idempotencykey, data]
            properties:
              type:
                description: Stable semantic command type.
                const: global.govstack.registry.registrant.deregisterRequested
              idempotencykey:
                type: string
                format: uuid
                description: CloudEvents extension used to de-duplicate command processing.
              data:
                type: object
                description: GovStack domain payload for the deregister command.
                required: [registrantId, reason]
                properties:
                  registrantId:
                    type: string
                    format: uuid
                    description: Identifier of the registrant to deregister.
                  reason:
                    type: string
                    description: Human-readable reason for the deregistration.
      examples:
        - name: deregisterRegistrant
          summary: A deregister command for a registrant.
          headers:
            correlationId: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
          payload:
            specversion: '1.0'
            id: 2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
            source: /govstack/registry
            type: global.govstack.registry.registrant.deregisterRequested
            time: '2026-07-10T12:40:00Z'
            datacontenttype: application/json
            idempotencykey: 2c3d4e5f-6a7b-8c9d-0e1f-2a3b4c5d6e7f
            data:
              registrantId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
              reason: Requested by registrant.
    deregisterRegistrantResult:
      name: deregisterRegistrantResult
      title: Deregister registrant result
      summary: Reports the outcome of a deregister command.
      contentType: application/cloudevents+json
      headers:
        type: object
        description: Message metadata headers for the deregister result.
        properties:
          correlationId:
            type: string
            format: uuid
            description: Correlation identifier copied from the originating command.
      correlationId:
        location: $message.header#/correlationId
        description: Correlates the reply back to the originating command.
      payload:
        allOf:
          - $ref: '../../../../api/common/govstack-asyncapi-common.yaml#/components/schemas/CloudEventEnvelope'
          - type: object
            description: Registry-specific result type and domain payload.
            required: [data]
            properties:
              type:
                description: Stable semantic result type.
                const: global.govstack.registry.registrant.deregistered
              data:
                type: object
                description: GovStack domain payload for the deregister result.
                required: [registrantId, deregisteredAt]
                properties:
                  registrantId:
                    type: string
                    format: uuid
                    description: Identifier of the registrant that was deregistered.
                  deregisteredAt:
                    type: string
                    format: date-time
                    description: RFC 3339 timestamp when the registrant was deregistered.
      examples:
        - name: deregisterResult
          summary: A successful deregistration result.
          headers:
            correlationId: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
          payload:
            specversion: '1.0'
            id: 3d4e5f6a-7b8c-9d0e-1f2a-3b4c5d6e7f80
            source: /govstack/registry
            type: global.govstack.registry.registrant.deregistered
            time: '2026-07-10T12:41:00Z'
            datacontenttype: application/json
            data:
              registrantId: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
              deregisteredAt: '2026-07-10T12:41:00Z'
    registrantDeregistrationRejected:
      name: registrantDeregistrationRejected
      title: Registrant deregistration rejected
      summary: Reports that a deregister command was rejected.
      contentType: application/json
      headers:
        type: object
        description: Message metadata headers for the rejection.
        properties:
          correlationId:
            type: string
            format: uuid
            description: Correlation identifier copied from the originating command.
      correlationId:
        location: $message.header#/correlationId
        description: Correlates the rejection back to the originating command.
      payload:
        $ref: '../../../../api/common/govstack-asyncapi-common.yaml#/components/schemas/GovStackAsyncError'
      examples:
        - name: deregistrationRejected
          summary: A rejected deregistration.
          headers:
            correlationId: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
          payload:
            type: https://docs.example.gov/registry/problems/deregistration-rejected
            title: Deregistration rejected
            detail: The registrant has an active obligation and cannot be deregistered.
            code: global.govstack.registry.deregistrationRejected
            traceId: 9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c
            timestamp: '2026-07-10T12:41:05Z'
