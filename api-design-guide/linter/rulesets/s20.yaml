# Rules for §20 conformance and validation — generated from the guide; see coverage.yaml.
#
# Implements guide rule 20.3 (the info.x-govstack-api-guide conformance
# declaration). Source text: ../../rules.yaml. 20.1 (run the OpenAPI/AsyncAPI
# schema validator) and 20.2 (meta/self-referential governance of the ruleset
# itself) are driver/CI and human territory respectively, out of scope here.
functionsDir: "../functions"
functions:
  - extensionShape
rules:
  # 20.3 [M] — info.x-govstack-api-guide MUST be an object with exact-target
  # SemVer `version` and `rulesetVersion`. Exact supported-version matching is
  # enforced by the repository driver. Surface: Universal, so this applies to both OpenAPI and
  # AsyncAPI canonical files' info block; formats widened like the other
  # info-level rules so it still fires on a wrong-spec-version doc.
  govstack-20.3:
    description: "info.x-govstack-api-guide must declare SemVer version and rulesetVersion (guide 20.3, [M])."
    message: "[20.3][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-e/20-conformance-and-validation.md#203-declared-guide-conformance-version
    severity: error
    formats: [oas3, aas2, aas3]
    given: $.info
    then:
      function: extensionShape
      functionOptions:
        extension: x-govstack-api-guide
        valueType: object
        requiredKeys: [version, rulesetVersion]
        semverKeys: [version, rulesetVersion]

  # 20.3 [M] — exceptions are reviewable, expiring records. The repository
  # driver additionally verifies that `rule` is a known guide rule and that the
  # exception is not expired before it suppresses any finding.
  govstack-20.3-exceptions:
    description: "x-govstack-api-guide.exceptions entries must be objects referencing an approved exception record (guide 20.3, [M])."
    message: "[20.3][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-e/20-conformance-and-validation.md#203-declared-guide-conformance-version
    severity: error
    formats: [oas3, aas2, aas3]
    given: $.info
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            x-govstack-api-guide:
              type: object
              properties:
                exceptions:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [rule, scope, rationale, record, reviewedBy, reviewedAt, expiresAt]
                    properties:
                      rule:
                        type: string
                        pattern: '^\d+\.\d+$'
                      scope:
                        type: string
                        pattern: '^(?:/(?:[^~]|~[01])*)*$'
                      rationale:
                        type: string
                        minLength: 10
                      record:
                        type: string
                        pattern: '^https://'
                      reviewedBy:
                        type: string
                        minLength: 2
                      reviewedAt:
                        type: string
                        pattern: '^\d{4}-\d{2}-\d{2}$'
                      expiresAt:
                        type: string
                        pattern: '^\d{4}-\d{2}-\d{2}$'
