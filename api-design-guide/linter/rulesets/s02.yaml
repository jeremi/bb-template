# Rules for §2 OpenAPI document standards — proof-of-concept section.
#
# Implements guide rules 2.1, 2.5, 2.6, 2.7. Source text: ../../rules.yaml.
# Severity policy and formats follow ../README.md#rule-naming-and-severities.
#
# Custom functions: this fragment declares functionsDir + functions so the
# bundler (programmatic) and the CLI both resolve valuePattern from
# ../functions. This has been verified to work through an `extends` chain.
functionsDir: "../functions"
functions:
  - valuePattern
rules:
  # 2.1 [M] — this ruleset qualifies the published 3.1.0-3.1.2 patches only.
  govstack-2.1:
    description: "OpenAPI version must be a qualified 3.1 patch (3.1.0-3.1.2; guide 2.1, [M])."
    message: "[2.1][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#21-openapi-31-required
    severity: error
    formats: [oas2, oas3]
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [openapi]
          properties:
            openapi:
              enum: ["3.1.0", "3.1.1", "3.1.2"]

  # 2.5 [M] — info MUST include title, version, and description. Contact is advisory.
  # Split per the documented suffix convention: presence here, SemVer below.
  # formats [oas3] so the info block is checked even on a wrong-version doc.
  govstack-2.5:
    description: "info block must include title, version, and description (guide 2.5, [M])."
    message: "[2.5][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#25-complete-info-block
    severity: error
    formats: [oas3]
    given: $.info
    then:
      function: schema
      functionOptions:
        allErrors: true
        schema:
          type: object
          required: [title, version, description]
          properties:
            title: { type: string, minLength: 1 }
            description: { type: string, minLength: 1 }
            contact: { type: object }

  # 2.5 [M] — info.version MUST be SemVer. Uses the shared valuePattern function.
  govstack-2.5-semver:
    description: "info.version must be a SemVer string (guide 2.5, [M])."
    message: "[2.5][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#25-complete-info-block
    severity: error
    formats: [oas3]
    given: $.info.version
    then:
      function: valuePattern
      functionOptions:
        name: info.version
        match: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-.]+)?(?:\+[0-9A-Za-z-.]+)?$'

  # 2.6 [M+R] — deterministic MUST clauses are blocking: servers is non-empty,
  # URLs use HTTPS, avoid loopback, and do not duplicate /vN from path keys.
  # Does NOT verify: that URLs are "meaningful"/not fake production domains, the
  # SHOULD to use parameterised template URLs, or the MAY to label example.org
  # defaults as non-production. Those are not mechanically decidable.
  govstack-2.6:
    description: "servers must be non-empty HTTPS URLs without loopback or duplicate /vN (guide 2.6, [M+R])."
    message: "[2.6][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#26-meaningful-servers-block
    severity: error
    formats: [oas3_1]
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [servers]
          properties:
            servers:
              type: array
              minItems: 1
              items:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    allOf:
                      - pattern: '^https://'
                      - not:
                          pattern: 'localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?'
                      - not:
                          pattern: '/v[0-9]+(?:/|$)'

  # 2.7 [M+R] — every operation MUST include a stable operationId and description.
  # Casing, summary, and tags are advisory.
  govstack-2.7:
    description: "every operation must declare a stable operationId and description (guide 2.7, [M+R])."
    message: "[2.7][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#27-complete-operation-metadata
    severity: error
    formats: [oas3_1]
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      function: schema
      functionOptions:
        allErrors: true
        schema:
          type: object
          required: [operationId, description]
          properties:
            operationId:
              type: string
              minLength: 1
            description: { type: string, minLength: 1 }
            tags:
              type: array
              minItems: 1
