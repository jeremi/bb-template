# Rules for §2 OpenAPI document standards — proof-of-concept section.
#
# Implements guide rules 2.1, 2.5, 2.6, 2.7. Source text: ../../rules.yaml.
# Severity policy and formats follow <SCRATCHPAD>/linter-conventions.md.
#
# Custom functions: this fragment declares functionsDir + functions so the
# bundler (programmatic) and the CLI both resolve valuePattern from
# ../functions. This has been verified to work through an `extends` chain.
functionsDir: "../functions"
functions:
  - valuePattern
rules:
  # 2.1 [M] — the spec MUST declare openapi: 3.1.0; earlier versions MUST NOT.
  # formats [oas2, oas3] so a 2.x/3.0.x document is still told to move to 3.1.0.
  govstack-2.1:
    description: "OpenAPI version must be exactly 3.1.0 (guide 2.1, [M])."
    message: "[2.1][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#21-openapi-310-required
    severity: error
    formats: [oas2, oas3]
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [openapi]
          properties:
            openapi:
              const: "3.1.0"

  # 2.5 [M] — info MUST include title, version, description, contact.
  # Split per the documented suffix convention: presence here, SemVer below.
  # formats [oas3] so the info block is checked even on a wrong-version doc.
  govstack-2.5:
    description: "info block must include title, version, description, contact (guide 2.5, [M])."
    message: "[2.5][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#25-complete-info-block
    severity: error
    formats: [oas3]
    given: $.info
    then:
      function: schema
      functionOptions:
        allErrors: true
        schema:
          type: object
          required: [title, version, description, contact]
          properties:
            title: { type: string, minLength: 1 }
            description: { type: string, minLength: 1 }
            contact: { type: object }

  # 2.5 [M] — info.version MUST be SemVer. Uses the shared valuePattern function.
  govstack-2.5-semver:
    description: "info.version must be a SemVer string (guide 2.5, [M])."
    message: "[2.5][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#25-complete-info-block
    severity: error
    formats: [oas3]
    given: $.info.version
    then:
      function: valuePattern
      functionOptions:
        name: info.version
        match: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-.]+)?(?:\+[0-9A-Za-z-.]+)?$'

  # 2.6 [M+R] — PROXY (bucket B), notched one step: MUST -> warn.
  # Verifies: servers is non-empty AND no server URL points at localhost/loopback.
  # Does NOT verify: that URLs are "meaningful"/not fake production domains, the
  # SHOULD to use parameterised template URLs, or the MAY to label example.org
  # defaults as non-production. Those are not mechanically decidable.
  govstack-2.6:
    description: "servers must be non-empty and not point at localhost/loopback (guide 2.6, [M+R], proxy)."
    message: "[2.6][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#26-meaningful-servers-block
    severity: warn
    formats: [oas3_1]
    given: $
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [servers]
          properties:
            servers:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  url:
                    type: string
                    not:
                      pattern: 'localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?'

  # 2.7 [M+R] — every operation MUST include operationId (camelCase), summary,
  # description, and >=1 tag. The verb-noun convention for operationId is not
  # mechanically verified (only camelCase is).
  govstack-2.7:
    description: "every operation must declare operationId(camelCase), summary, description, >=1 tag (guide 2.7, [M+R])."
    message: "[2.7][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-a/2-openapi-document-standards.md#27-complete-operation-metadata
    severity: error
    formats: [oas3_1]
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace]"
    then:
      function: schema
      functionOptions:
        allErrors: true
        schema:
          type: object
          required: [operationId, summary, description, tags]
          properties:
            operationId:
              type: string
              minLength: 1
              pattern: '^[a-z][a-zA-Z0-9]*$'
            summary: { type: string, minLength: 1 }
            description: { type: string, minLength: 1 }
            tags:
              type: array
              minItems: 1
