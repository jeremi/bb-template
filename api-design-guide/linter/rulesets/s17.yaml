# Rules for §17 event-driven APIs (AsyncAPI channel documentation).
#
# Source text: ../../rules.yaml (§17). Severity policy, formats (aas3) and the
# proxy/notch conventions follow ../README.md#rule-naming-and-severities and
# ../coverage.yaml. AsyncAPI-surface rules gate on `formats: [aas3]`.
#
# Custom functions live in ../functions; every function referenced below is
# listed so the bundler and the CLI resolve them through the extends chain.
functionsDir: "../functions"
functions:
  - valuePattern
  - s17-channelIds
  - schemaPropertyNames
  - s17-channelParameters
  - s17-cloudEventsPayload
  - s17-securityCoverage
  - s17-rejectionMessage
  - s17-requestReply
  - s17-protocolBindings
rules:
  # 17.1 [M+R] — every operation MUST declare action send|receive (the BB's
  # publish/consume perspective).
  govstack-17.1:
    description: "Every AsyncAPI operation must declare action send or receive (guide 17.1, [M+R])."
    message: "[17.1][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#171-send-and-receive-perspective
    severity: error
    formats: [aas3]
    given: $.operations[*]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [action]
          properties:
            action:
              enum: [send, receive]

  # 17.2 [M+R] — logical channel IDs (the keys under `channels`) MUST follow
  # reverse-DNS global.govstack.{bb-code}.v{major}.{resource}.{event}. Channel
  # Object addresses intentionally retain protocol-native destination syntax.
  govstack-17.2:
    description: "Logical channel IDs must follow reverse-DNS global.govstack.{bb-code}.v{major}.{resource}.{event} (guide 17.2, [M+R])."
    message: "[17.2][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#172-stable-logical-channel-ids-and-native-addresses
    severity: error
    formats: [aas3]
    given: $.channels
    then:
      function: s17-channelIds

  # 17.4 [M+R] — every {param} in a channel address MUST be declared under the
  # channel parameters object and documented (non-empty description). The rule's
  # enum-for-closed-sets and examples-for-open-values clauses are [R]: whether a
  # parameter's value set is closed cannot be determined from the document.
  govstack-17.4:
    description: "Every {param} in a channel address must be declared under parameters and documented (guide 17.4, [M+R])."
    message: "[17.4][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#174-declared-channel-parameters
    severity: error
    formats: [aas3]
    given: $.channels[*]
    then:
      function: s17-channelParameters

  # 17.5 [M+R] — PROXY (bucket B). SHOULD NOT -> info. Flags env/broker tokens
  # (dev/test/prod/staging/kafka/mqtt/amqp/…) as address segments. Does NOT
  # verify arbitrary broker implementation names or deployment prefixes, and a
  # token list can miss/over-match legitimate resource names.
  govstack-17.5:
    description: "Channel addresses should not contain environment/broker names (guide 17.5, [M+R], proxy)."
    message: "[17.5][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#175-no-environment-names-in-addresses
    severity: info
    formats: [aas3]
    given: $.channels[*].address
    then:
      function: valuePattern
      functionOptions:
        name: channel address
        flags: i
        forbidPattern: '(^|[.\-_])(dev|test|prod|staging|uat|qa|sandbox|preprod|nonprod|kafka|rabbitmq|mqtt|amqp|broker)([.\-_]|$)'

  # 17.6 [M] — domain-event Message Objects MUST use the structured CloudEvents
  # JSON media type and carry any GovStack domain data under `data`. The rule checks
  # messages that declare the media type, envelope reference, or CloudEvents
  # fields. It deliberately skips other messages because their semantic role is
  # not machine-identifiable. The base validator resolves external references.
  govstack-17.6:
    description: "Domain-event Message Objects must use application/cloudevents+json and structured CloudEvents payloads with any domain data under `data` (guide 17.6, [M])."
    message: "[17.6][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#176-structured-cloudevents-json-payloads
    severity: error
    formats: [aas3]
    given: $.components.messages[*]
    then:
      function: s17-cloudEventsPayload

  # 17.7 [M] — Message Objects remain local. Recognizable CloudEvents and async
  # error payloads MUST reference the reviewed envelope or async-error schema
  # from the vendored common file. Other message kinds are outside this rule.
  # The base validator separately proves that the external ref resolves.
  govstack-17.7:
    description: "CloudEvents and async-error Message Objects must reference payload schemas from the vendored govstack-asyncapi-common.yaml file (guide 17.7, [M])."
    message: "[17.7][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#177-shared-cloudevents-envelope-schema
    severity: error
    formats: [aas3]
    resolved: false
    given: $.components.messages[*]
    then:
      function: s17-cloudEventsPayload
      functionOptions:
        requireSharedReference: true

  # 17.8 [M+R] — PROXY (bucket B), MUST -> warn. GovStack-owned message headers
  # MUST be camelCase and MUST NOT use the X- prefix (camelCase subsumes the X-
  # ban). Does NOT verify the command idempotency-key requirement (needs command
  # identification) nor CloudEvents trace extension attributes.
  govstack-17.8:
    description: "Message header names must be camelCase / not X- prefixed (guide 17.8, [M+R], proxy)."
    message: "[17.8][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#178-message-headers-and-idempotency-metadata
    severity: warn
    formats: [aas3]
    given: $.components.messages[*].headers
    then:
      function: schemaPropertyNames
      functionOptions:
        casing: camel

  # 17.9 [M+R] — PROXY (bucket B), MUST -> warn. Localisation headers MUST be
  # exactly acceptLanguage / contentLanguage. Flags near-miss variants
  # (Accept-Language, content_language, language, locale, lang, …). Does NOT
  # verify inbound-vs-outbound direction, nor the "stable fields MUST NOT be
  # translated" clause.
  govstack-17.9:
    description: "Localisation message headers must be named acceptLanguage/contentLanguage (guide 17.9, [M+R], proxy)."
    message: "[17.9][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#179-message-localisation-headers
    severity: warn
    formats: [aas3]
    given: $.components.messages[*].headers
    then:
      function: schemaPropertyNames
      functionOptions:
        forbidPattern: '^(?:[Aa]ccept[-_ ][Ll]anguage|ACCEPT[-_ ]LANGUAGE|[Cc]ontent[-_ ][Ll]anguage|CONTENT[-_ ]LANGUAGE|language|Language|LANGUAGE|locale|Locale|lang|Lang)$'

  # 17.10 [M+R] — security schemes MUST be declared under components and applied
  # on servers/operations so every operation is covered. Message signing (§16.5)
  # is not accepted as a substitute (only servers/operations security counts).
  govstack-17.10:
    description: "AsyncAPI security schemes must cover every operation via servers/operations (guide 17.10, [M+R])."
    message: "[17.10][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#1710-security-schemes-cover-every-operation
    severity: error
    formats: [aas3]
    given: $
    then:
      function: s17-securityCoverage

  # 17.16 [M+R] — PROXY (bucket B), MUST -> warn. Asserts an async rejection/
  # failure message using the §11 error envelope exists and is correlated. Does
  # NOT identify which operations are command-like, nor verify the correlation
  # actually points at the initiating message.
  govstack-17.16:
    description: "An async rejection message using the §11 error envelope, correlated, must exist (guide 17.16, [M+R], proxy)."
    message: "[17.16][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#1716-async-rejection-error-messages
    severity: warn
    formats: [aas3]
    given: $
    then:
      function: s17-rejectionMessage

  # 17.17 [M+R] — when an operation declares a reply, it MUST declare the reply
  # channel/address AND a correlation mechanism (a message correlationId or a
  # reply address location). Fire-and-forget "pretending" is not decidable.
  govstack-17.17:
    description: "Request-reply operations must declare a reply channel/address and a correlation mechanism (guide 17.17, [M+R])."
    message: "[17.17][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#1717-declared-request-reply-correlation
    severity: error
    formats: [aas3]
    given: $.operations[*]
    then:
      function: s17-requestReply

  # 17.19 [M+R] — PROXY (bucket B), MUST -> warn. Where servers declare a
  # binding-relevant protocol, each channel (or an operation bound to it) should
  # declare a matching protocol binding. Does NOT verify the specific binding
  # fields (topic/key, QoS/retained, exchange/routing-key, framing).
  govstack-17.19:
    description: "Channels/operations should declare protocol bindings matching the server protocol (guide 17.19, [M+R], proxy)."
    message: "[17.19][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#1719-protocol-bindings-where-relevant
    severity: warn
    formats: [aas3]
    given: $
    then:
      function: s17-protocolBindings

  # 17.20 [M+R] — every components.messages entry MUST define at least one
  # example. The SHOULD to show headers+payload per message family
  # (command/event/error/completion) is not mechanically verified.
  govstack-17.20:
    description: "Every message must define at least one example (guide 17.20, [M+R])."
    message: "[17.20][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/17-asyncapi-channel-rules.md#1720-examples-for-every-message
    severity: error
    formats: [aas3]
    given: $.components.messages[*]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [examples]
          properties:
            examples:
              type: array
              minItems: 1
