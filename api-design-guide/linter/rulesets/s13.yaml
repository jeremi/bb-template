# Rules for §13 authentication and authorisation — generated from the guide.
#
# Implements 13.1, 13.5 (implemented) and 13.2, 13.3, 13.4, 13.6 (partial-proxy).
# Source text: ../../rules.yaml. Severity/formats per <SCRATCHPAD>/linter-conventions.md.
#
# Surface note: §13 rules are "Universal", but the mechanical checks here target
# the OpenAPI surface (formats [oas3_1]). AsyncAPI security coverage/schemes are
# enforced by §17 (17.10 and related); the AsyncAPI parts of §13 are not
# re-checked here.
functionsDir: "../functions"
functions:
  - securityCoverage
  - s13-schemeExists
  - s13-scopeNames
  - s13-apiKeyScope
rules:
  # 13.1 [M] — declare a security scheme block and apply it by default to every
  # operation; per-operation overrides must be explicit. On OpenAPI: root-level
  # `security` + `components.securitySchemes`, covering every operation (an
  # operation-level `security` — including `security: []` — is an explicit
  # override). AsyncAPI coverage is handled by §17.10.
  govstack-13.1:
    description: "every operation must be covered by a declared security scheme (guide 13.1, [M])."
    message: "[13.1][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/13-authentication-and-authorisation.md#131-default-security-on-every-operation
    severity: error
    formats: [oas3_1]
    given: $
    then:
      function: securityCoverage
      functionOptions:
        requireSchemes: true

  # 13.2 [M+R] — PROXY (bucket B), MUST notched to warn.
  # Verifies: an openIdConnect or oauth2 scheme is declared.
  # Does NOT verify: which operations are citizen-facing, that citizen-facing
  # operations actually apply this scheme, or discovery-URL validity.
  govstack-13.2:
    description: "an OAuth 2.0 / OpenID Connect security scheme must be declared (guide 13.2, [M+R], proxy)."
    message: "[13.2][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/13-authentication-and-authorisation.md#132-oauth-and-oidc-for-citizen-operations
    severity: warn
    formats: [oas3_1]
    given: $
    then:
      function: s13-schemeExists
      functionOptions:
        types: [openIdConnect, oauth2]
        label: "OAuth 2.0 / OpenID Connect"

  # 13.3 [M+R] — PROXY (bucket B), MUST notched to warn.
  # Verifies: a service-to-service scheme is declared (mutualTLS, or oauth2 with
  # a clientCredentials flow).
  # Does NOT verify: which operations cross a BB-to-BB trust boundary, that they
  # apply this scheme, or the AsyncAPI X509/SASL variants (that surface is §17).
  govstack-13.3:
    description: "a service-to-service (mTLS / OAuth client-credentials) scheme must be declared (guide 13.3, [M+R], proxy)."
    message: "[13.3][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/13-authentication-and-authorisation.md#133-distinct-scheme-for-bb-to-bb-calls
    severity: warn
    formats: [oas3_1]
    given: $
    then:
      function: s13-schemeExists
      functionOptions:
        types: [mutualTLS]
        oauthFlows: [clientCredentials]
        label: "service-to-service (mTLS / OAuth client-credentials)"

  # 13.4 [M] — PROXY (bucket B), MUST notched to warn.
  # Verifies: every declared OAuth scope string matches one of the documented
  # shapes (default bb:{bb-code}:{resource}:{action}, reverse-DNS, or
  # resource.action).
  # Does NOT verify: that {bb-code} is the BB's registered code (§9.11), scope
  # ecosystem-uniqueness, single-convention consistency, or per-operation
  # scope documentation.
  govstack-13.4:
    description: "OAuth scope strings must follow the ecosystem-wide naming convention (guide 13.4, [M], proxy)."
    message: "[13.4][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/13-authentication-and-authorisation.md#134-namespaced-oauth-scopes
    severity: warn
    formats: [oas3_1]
    given: $.components.securitySchemes[*].flows[*].scopes
    then:
      function: s13-scopeNames
      functionOptions:
        label: "the GovStack scope naming convention"
        patterns:
          - '^bb:[a-z][a-z0-9-]*:[A-Za-z0-9-]+:[A-Za-z0-9-]+$'
          - '^org\.govstack\.[a-z][a-z0-9-]*\.[A-Za-z0-9-]+\.[A-Za-z0-9-]+$'
          - '^[A-Za-z0-9-]+\.[A-Za-z0-9-]+$'

  # 13.5 [M+R] — credentials MUST NOT be declared in query parameters or
  # cookies; the Authorization header is the only declared credential channel.
  # Mechanically: an apiKey scheme MUST NOT use `in: query` or `in: cookie`
  # (path/fragment credentials cannot be expressed as OpenAPI security schemes).
  govstack-13.5:
    description: "apiKey security schemes must not use in: query or in: cookie (guide 13.5, [M+R])."
    message: "[13.5][M+R] Credentials must not be declared in query parameters or cookies; an apiKey scheme must not set in: query or in: cookie. Use the Authorization header."
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/13-authentication-and-authorisation.md#135-authorization-is-the-credential-channel
    severity: error
    formats: [oas3_1]
    given: $.components.securitySchemes[*]
    then:
      function: schema
      functionOptions:
        schema:
          not:
            allOf:
              - properties: { type: { const: apiKey } }
                required: [type]
              - properties: { in: { enum: [query, cookie] } }
                required: [in]

  # 13.6 [R] — PROXY (bucket B), MUST NOT notched to warn.
  # Verifies: no apiKey scheme is applied (via root or operation `security`) to a
  # non-operational (non-health-like) operation.
  # Does NOT verify: which operations "read or write personal data" (uses a §5.9
  # operational-path heuristic instead), nor credentials applied outside declared
  # security requirements.
  govstack-13.6:
    description: "apiKey schemes must be applied only to operational (health-like) endpoints (guide 13.6, [R], proxy)."
    message: "[13.6][R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-d/13-authentication-and-authorisation.md#136-api-keys-only-for-operational-endpoints
    severity: warn
    formats: [oas3_1]
    given: $
    then:
      function: s13-apiKeyScope
