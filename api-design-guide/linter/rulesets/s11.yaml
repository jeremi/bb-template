# Rules for §11 error handling — generated from the guide; see coverage.yaml.
#
# Implements the mechanically checkable portions of guide rules 11.1-11.4.
# Field-error applicability and identifier stability remain review/runtime
# concerns as documented in coverage.yaml.
#
# Surface for 11.1-11.5 is "Universal" in rules.yaml, but the mechanism below
# (HTTP status codes, `content` media types) only maps onto the OpenAPI
# surface: AsyncAPI has no equivalent request/response status-code model, so
# these rules are implemented for oas3_1 only.
functionsDir: "../functions"
functions:
  - mediaTypeExpected
  - envelopeShape
  - s11-fieldErrors
  - s11-problemType
rules:
  # 11.1 [M] — error responses (4xx/5xx) MUST use application/problem+json.
  # "Error responses" is read as any response declared under a 4xx or 5xx
  # status key; a `default` response is not assumed to be an error and is not
  # checked here.
  govstack-11.1:
    description: "4xx/5xx responses must use application/problem+json (guide 11.1, [M])."
    message: "[11.1][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-c/11-errors.md#111-rfc-9457-problem-details
    severity: error
    formats: [oas3_1]
    given: "$.paths[*][get,put,post,delete,options,head,patch,trace].responses[?(@property.match(/^[45]/))].content"
    then:
      function: mediaTypeExpected
      functionOptions:
        require: ['application/problem\+json']

  # 11.2 [M+R] — the RFC 9457 fields type/title/status MUST be present and the
  # duplicate identifier `code` and redundant `timestamp` MUST NOT be added.
  # `detail`/`instance` are SHOULD ("when they add diagnostic value") and the
  # no-PII declaration is a documentation/human concern.
  govstack-11.2:
    description: "problem+json schema must declare type, title, status (guide 11.2, [M+R])."
    message: "[11.2][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-c/11-errors.md#112-stable-http-problem-type-uri
    severity: error
    formats: [oas3_1]
    given: '$.paths[*][get,put,post,delete,options,head,patch,trace].responses[?(@property.match(/^[45]/))].content["application/problem+json"].schema'
    then:
      function: envelopeShape
      functionOptions:
        requiredProperties: [type, title, status]
        forbiddenProperties: [code, timestamp]

  # 11.3 [M] — traceId is the sole required GovStack extension. `resolved`
  # defaults to true, so a shared Problem schema referenced from the vendored
  # common file is inspected after reference resolution.
  govstack-11.3:
    description: "problem+json schema must declare traceId (guide 11.3, [M])."
    message: "[11.3][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-c/11-errors.md#113-trace-identifier
    severity: error
    formats: [oas3_1]
    given: '$.paths[*][get,put,post,delete,options,head,patch,trace].responses[?(@property.match(/^[45]/))].content["application/problem+json"].schema'
    then:
      function: envelopeShape
      functionOptions:
        requiredProperties: [traceId]

  # 11.4 [M+R] — when a problem schema opts into field-level errors, the array
  # MUST be required and each item MUST contain pointer/message. This rule does
  # NOT infer field attribution from an HTTP status code: an ordinary 400 may
  # use Problem without errors, while a 422 may legitimately use
  # ValidationProblem. Deciding when field errors apply requires review.
  govstack-11.4:
    description: "declared field errors must be a required errors[] array with pointer/message (guide 11.4, [M+R], proxy)."
    message: "[11.4][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-c/11-errors.md#114-field-level-errors-array
    severity: warn
    formats: [oas3_1]
    given: '$.paths[*][get,put,post,delete,options,head,patch,trace].responses[?(@property.match(/^[45]/))].content["application/problem+json"].schema'
    then:
      function: s11-fieldErrors

  # 11.2 [M+R] — literal problem type values supplied in examples, consts or
  # enums use the canonical GovStack URI. Runtime instances are validated by
  # the shared schema and conformance tests, not Spectral.
  govstack-11.2-type:
    description: "literal problem types must use the canonical GovStack problem URI (guide 11.2, [M+R], proxy)."
    message: "[11.2][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-c/11-errors.md#112-stable-http-problem-type-uri
    severity: warn
    formats: [oas3_1]
    given: '$.paths[*][get,put,post,delete,options,head,patch,trace].responses[?(@property.match(/^[45]/))].content["application/problem+json"]'
    then:
      function: s11-problemType
