# STRICT-only rules for §5 — noisy lexical heuristics, opt-in via
# ../strict.yaml. All at severity `warn` per
# ../README.md#rule-naming-and-severities, regardless of the guide rule's own
# strength. Source text: ../../rules.yaml.
functionsDir: "../functions"
functions:
  - s05-pluralNoun
  - s05-actionVerbs
rules:
  # 5.2 [M+R] SHOULD — resource paths use plural nouns. Lexical "last word ends
  # in s" heuristic; see functions/s05-pluralNoun.js for known false
  # positives (e.g. "status") and false negatives (irregular plurals not
  # listed).
  govstack-5.2:
    description: "Resource path segments should look like plural nouns (guide 5.2, [M+R], strict heuristic)."
    message: "[5.2][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#52-plural-noun-resources
    severity: warn
    formats: [oas3_1]
    given: $.paths
    then:
      function: s05-pluralNoun
      functionOptions:
        exceptions: [health, ready]

  # 5.7 [M+R] SHOULD NOT — verbs in CRUD paths. Lexical dictionary heuristic;
  # see functions/s05-actionVerbs.js. Domain actions may use either action
  # sub-resources or colon custom methods under 5.8; their semantics require review.
  govstack-5.7:
    description: "Verbs should not appear in paths for CRUD operations (guide 5.7, [M+R], strict heuristic)."
    message: "[5.7][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#57-no-verbs-in-crud-paths
    severity: warn
    formats: [oas3_1]
    given: $.paths
    then:
      function: s05-actionVerbs
