openapi: 3.1.0
info:
  title: GovStack Building Block Template Reference API
  version: 1.0.0
  description: >-
    Small reference contract demonstrating the cross-BB API conventions. A real
    Building Block replaces the Record domain while preserving conformance and
    requirement traceability.
  contact:
    name: GovStack API Working Group
    url: https://www.govstack.global/
  x-govstack-api-guide:
    version: 0.1.0-draft
    rulesetVersion: 0.1.0-draft
  x-govstack-common-components:
    openapi: 0.1.0-draft
  x-govstack-bb-code: template
servers:
  - url: https://{gatewayHost}/{bbCode}
    description: Non-production parameterised gateway pattern for the reference API.
    variables:
      gatewayHost:
        default: api.example.org
        description: Deployment gateway host; example.org is a reserved non-production default.
      bbCode:
        default: template
        description: Registered code of the deployed Building Block.
security:
  - BuildingBlockOAuth:
      - bb:template:records:read
tags:
  - name: Records
    description: Reference resource operations used to demonstrate synchronous API conventions.
  - name: Exports
    description: Reference long-running export request.
  - name: Operations
    description: Polling and cancellation of long-running work.
  - name: Health
    description: Operational liveness contract.
paths:
  /v1/records:
    get:
      operationId: listRecords
      summary: List reference records
      description: Returns a bounded cursor-paginated collection of reference records.
      tags:
        - Records
      security:
        - CitizenOAuth:
            - bb:template:records:read
        - BuildingBlockOAuth:
            - bb:template:records:read
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of reference records.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordCollection'
              example:
                items:
                  - id: 7d9ad9df-bfc3-451a-94e0-24afae30750f
                    name: Reference record
                    status: ACTIVE
                    createdAt: '2026-07-10T10:00:00Z'
                    updatedAt: '2026-07-10T10:00:00Z'
                pageInfo:
                  nextCursor: pgn_7JpQ9m2W4xK8fR3cT6vN1
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createRecord
      summary: Create a reference record
      description: Creates a reference record synchronously and returns its representation.
      tags:
        - Records
      security:
        - CitizenOAuth:
            - bb:template:records:write
        - BuildingBlockOAuth:
            - bb:template:records:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Values supplied by the caller for the new reference record.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecordRequest'
            example:
              name: Reference record
              status: ACTIVE
      responses:
        '201':
          description: Reference record created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example:
                id: 7d9ad9df-bfc3-451a-94e0-24afae30750f
                name: Reference record
                status: ACTIVE
                createdAt: '2026-07-10T10:00:00Z'
                updatedAt: '2026-07-10T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/records/{recordId}:
    get:
      operationId: getRecord
      summary: Get a reference record
      description: Retrieves one reference record by its opaque server-generated identifier.
      tags:
        - Records
      security:
        - CitizenOAuth:
            - bb:template:records:read
        - BuildingBlockOAuth:
            - bb:template:records:read
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The requested reference record.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
              example:
                id: 7d9ad9df-bfc3-451a-94e0-24afae30750f
                name: Reference record
                status: ACTIVE
                createdAt: '2026-07-10T10:00:00Z'
                updatedAt: '2026-07-10T10:00:00Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/exports:
    post:
      operationId: requestRecordExport
      summary: Request a record export
      description: Accepts a long-running record export and returns a pollable Operation.
      tags:
        - Exports
      security:
        - BuildingBlockOAuth:
            - bb:template:exports:write
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Criteria and output format for the record export.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            example:
              format: JSON_LINES
              status: ACTIVE
      responses:
        '202':
          description: Export accepted for asynchronous processing.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_01J2P8WTM4YH7K6Q3N5R9C0XBF
                status: PENDING
                createdAt: '2026-07-10T10:05:00Z'
                updatedAt: '2026-07-10T10:05:00Z'
                progress: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/operations/{operationId}:
    get:
      operationId: getOperation
      summary: Get operation status
      description: Retrieves current state, result metadata, or error for long-running work.
      tags:
        - Operations
      security:
        - BuildingBlockOAuth:
            - bb:template:operations:read
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Current Operation state.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_01J2P8WTM4YH7K6Q3N5R9C0XBF
                status: RUNNING
                createdAt: '2026-07-10T10:05:00Z'
                updatedAt: '2026-07-10T10:05:10Z'
                progress: 40
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/operations/{operationId}/cancel:
    post:
      operationId: cancelOperation
      summary: Cancel an operation
      description: Requests cancellation of long-running work that has not reached a terminal state.
      tags:
        - Operations
      security:
        - BuildingBlockOAuth:
            - bb:template:operations:write
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Operation after the cancellation request was applied.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                id: op_01J2P8WTM4YH7K6Q3N5R9C0XBF
                status: CANCELLED
                createdAt: '2026-07-10T10:05:00Z'
                updatedAt: '2026-07-10T10:06:00Z'
                progress: 40
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      operationId: getHealth
      summary: Get liveness status
      description: Reports operational liveness without authentication or internal system detail.
      tags:
        - Health
      security: []
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The Building Block is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: PASS
                description: Reference API is live.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    CitizenOAuth:
      type: oauth2
      description: >-
        OAuth 2.0 authorization-code access for authenticated end-user clients.
        Clients use PKCE with S256. The API accepts access tokens and never
        treats an OpenID Connect ID token as an API access token.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.org/oauth2/authorize
          tokenUrl: https://identity.example.org/oauth2/token
          scopes:
            bb:template:records:read: Read reference records.
            bb:template:records:write: Create reference records.
    BuildingBlockOAuth:
      type: oauth2
      description: OAuth 2.0 client-credentials access for service-to-service calls.
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.org/oauth2/token
          scopes:
            bb:template:records:read: Read reference records.
            bb:template:records:write: Create reference records.
            bb:template:exports:write: Request reference record exports.
            bb:template:operations:read: Read long-running Operation state.
            bb:template:operations:write: Request cancellation of long-running Operations.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context parent identifier propagated across service boundaries.
      schema:
        type: string
        description: W3C Trace Context traceparent value.
        pattern: '^00-(?!0{32})[\da-f]{32}-(?!0{16})[\da-f]{16}-0[01]$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated opaque key that makes this non-idempotent request safe to retry.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        description: Opaque key retained for this API's documented replay window.
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of records returned in one page by this API.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as pageInfo.nextCursor by the previous page.
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      description: Opaque server-generated identifier of a long-running Operation resource.
      schema:
        type: string
        minLength: 1
    RecordId:
      name: recordId
      in: path
      required: true
      description: Opaque server-generated identifier of a reference record.
      schema:
        type: string
        format: uuid
        description: UUID assigned to a reference record by the server.
  headers:
    Location:
      description: URI reference of the created resource or accepted Operation.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Entity tag representing the version of the returned resource.
      schema:
        type: string
        minLength: 1
    CacheControl:
      description: Cache directive preventing storage of transient errors or Operation state.
      schema:
        type: string
        example: no-store
    WwwAuthenticate:
      description: OAuth 2.0 Bearer authentication challenge.
      schema:
        type: string
        example: 'Bearer realm="govstack", error="invalid_token"'
  responses:
    NotModified:
      description: The resource has not changed since the supplied entity tag.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: The request is malformed or cannot be interpreted.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/bad-request
            title: Bad request
            status: 400
            detail: The request could not be interpreted.
            instance: /v1/records
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Authentication is missing or invalid.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/unauthorized
            title: Authentication required
            status: 401
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: The authenticated caller is not authorised for the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/forbidden
            title: Permission denied
            status: 403
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: The addressed resource does not exist.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/not-found
            title: Resource not found
            status: 404
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: The request conflicts with the current resource state.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/conflict
            title: State conflict
            status: 409
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    UnprocessableContent:
      description: The request is well formed but contains invalid field values.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/ValidationProblem'
          example:
            type: https://govstack.global/problems/template/invalid-field
            title: Request validation failed
            status: 422
            detail: The requested record status is invalid.
            instance: /v1/records
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - pointer: /status
                message: Status must be ACTIVE or ARCHIVED.
    InternalError:
      description: An unexpected server error occurred.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/internal-error
            title: Internal error
            status: 500
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: The service is temporarily unavailable.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/template/service-unavailable
            title: Service unavailable
            status: 503
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    CreateRecordRequest:
      type: object
      description: Caller-controlled values used to create a reference record.
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable label that contains no personal data.
        status:
          type: string
          description: 'Requested state: ACTIVE for current records or ARCHIVED for retained records.'
          enum:
            - ACTIVE
            - ARCHIVED
          x-extensible-enum: true
    Record:
      type: object
      description: Generic resource used to demonstrate the template API conventions.
      required:
        - id
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Opaque server-generated record identifier.
        name:
          type: string
          description: Human-readable record label without personal data.
        status:
          type: string
          description: 'Current state: ACTIVE for current records or ARCHIVED for retained records.'
          enum:
            - ACTIVE
            - ARCHIVED
          x-extensible-enum: true
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 time at which the record was created.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 time at which the record last changed.
    RecordCollection:
      type: object
      description: Cursor-paginated collection of reference records.
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          description: Reference records in the current page.
          items:
            $ref: '#/components/schemas/Record'
        pageInfo:
          description: >-
            Page metadata. total, when present, is exact and describes the
            collection at the time this page is generated.
          $ref: './common/govstack-openapi-common.yaml#/components/schemas/PageInfo'
    ExportRequest:
      type: object
      description: Criteria and representation requested for a long-running record export.
      required:
        - format
      properties:
        format:
          type: string
          description: 'Export representation: JSON_LINES for newline-delimited JSON or CSV for comma-separated values.'
          enum:
            - JSON_LINES
            - CSV
          x-extensible-enum: true
        status:
          type: string
          description: 'Optional equality filter: ACTIVE for current records or ARCHIVED for retained records.'
          enum:
            - ACTIVE
            - ARCHIVED
          x-extensible-enum: true
    Operation:
      type: object
      description: Pollable representation of long-running work owned by this API.
      required:
        - id
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque server-generated Operation identifier.
        status:
          type: string
          description: 'Current lifecycle state: PENDING, RUNNING, SUCCEEDED, FAILED, or CANCELLED.'
          enum:
            - PENDING
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
          x-extensible-enum: true
        result:
          type: object
          description: Result metadata present when the Operation succeeds.
        error:
          $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 time at which the Operation was created.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 time at which the Operation last changed.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Optional completion percentage from zero through one hundred.
    Health:
      type: object
      description: Minimal operational liveness response without internal details.
      required:
        - status
      properties:
        status:
          type: string
          description: Template-defined informational liveness state.
          enum:
            - PASS
            - FAIL
            - WARN
          x-extensible-enum: false
        description:
          type: string
          description: Public, non-sensitive summary of the liveness state.
